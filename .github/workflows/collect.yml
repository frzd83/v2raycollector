name: جمع‌آوری کانفیگ‌ها با مدیریت خطا

on:
  schedule:
    - cron: '*/120 * * * *'
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: دانلود کانفیگ‌ها (با ادامه در صورت خطا)
        continue-on-error: true
        run: |
          echo "⏳ مرحله 1: دانلود از منابع ..."
          
          # منبع 1: کانفیگ‌های تست شده (در صورت وجود)
          curl -L -o source1.txt https://raw.githubusercontent.com/Delta-Kronecker/V2ray-Config/main/vless.txt || echo "منبع 1 در دسترس نیست"
          
          # منبع 2: کانفیگ‌های امن (در صورت وجود)
          curl -L -o source2.txt https://raw.githubusercontent.com/whoahaow/rjsxrd/main/default/1 || echo "منبع 2 در دسترس نیست"
          
          # منبع 3: کانفیگ‌های ساده و پایدار (جایگزین جدید)
          curl -L -o source3.txt https://raw.githubusercontent.com/freefq/free/master/v2ray || echo "منبع 3 در دسترس نیست"
          
          echo "✅ مرحله دانلود تمام شد."

      - name: ادغام فایل‌های موجود
        run: |
          echo "# =========================================" > merged.txt
          echo "# کانفیگ‌های V2Ray - به‌روز شده: $(date)" >> merged.txt
          echo "# =========================================" >> merged.txt
          echo "" >> merged.txt
          
          # فقط فایل‌هایی که وجود دارند را با هم ترکیب کن
          for file in source1.txt source2.txt source3.txt; do
            if [ -s "$file" ]; then
              echo "✅ اضافه کردن $file ..."
              cat "$file" >> merged.txt
            else
              echo "⚠️ فایل $file خالی یا موجود نیست، رد می‌شود."
            fi
          done
          
          # حذف خطوط تکراری و خالی
          sed -i '/^$/d' merged.txt
          sort -u -o merged.txt merged.txt
          
          # استخراج فقط کانفیگ‌های معتبر
          grep -E "(vless://|vmess://|trojan://)" merged.txt > temp.txt || true
          mv temp.txt merged.txt 2>/dev/null || true

      - name: Commit و Push (در صورت وجود تغییر)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add merged.txt
          
          # فقط اگر فایل خالی نبود، commit کن
          if [ -s merged.txt ]; then
            git diff --quiet && git diff --staged --quiet || git commit -m "به‌روزرسانی خودکار کانفیگ‌ها [skip ci]"
            git push origin HEAD:$(git rev-parse --abbrev-ref HEAD)
            echo "✅ تغییرات با موفقیت اعمال شد."
          else
            echo "⚠️ فایل merged.txt خالی است، commit انجام نشد."
            exit 0
          fi
