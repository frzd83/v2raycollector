name: جمع‌آوری کانفیگ‌های تضمینی

on:
  schedule:
    - cron: '*/120 * * * *'
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: دانلود از منابع زنده
        run: |
          echo "✅ در حال دانلود از Epodonios ..."
          curl -L -o epodonios.txt https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/v2ray.txt
          
          echo "✅ در حال دانلود از Chocolate4U ..."
          curl -L -o chocolate.txt https://raw.githubusercontent.com/Chocolate4U/V2Ray-Configs/main/All_Configs_Sub.txt
          
          echo "✅ در حال دانلود از freefq ..."
          curl -L -o freefq.txt https://raw.githubusercontent.com/freefq/free/master/v2ray

      - name: ادغام و پاکسازی
        run: |
          # ایجاد فایل خروجی
          > merged.txt
          
          echo "# =========================================" >> merged.txt
          echo "# کانفیگ‌های V2Ray از سه منبع معتبر" >> merged.txt
          echo "# به‌روز شده در تاریخ: $(date)" >> merged.txt
          echo "# =========================================" >> merged.txt
          echo "" >> merged.txt
          
          # وجود فایل‌ها را بررسی کن و ادغام کن
          [ -s epodonios.txt ] && cat epodonios.txt >> merged.txt
          [ -s chocolate.txt ] && cat chocolate.txt >> merged.txt
          [ -s freefq.txt ] && cat freefq.txt >> merged.txt
          
          # حذف خطوط خالی و تکراری
          sed -i '/^$/d' merged.txt
          sort -u -o merged.txt merged.txt
          
          # فقط کانفیگ‌های معتبر رو نگه دار
          cp merged.txt all_configs_backup.txt
          grep -E "(vless://|vmess://|trojan://|ss://)" merged.txt > temp.txt || echo "هیچ کانفیگ معتبری یافت نشد" > temp.txt
          mv temp.txt merged.txt
          
          # آمار نهایی رو نشون بده
          echo "✅ تعداد کل کانفیگ‌های استخراج شده: $(wc -l < merged.txt)"

      - name: Commit و Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add merged.txt all_configs_backup.txt
          
          if [ -s merged.txt ] && [ $(wc -l < merged.txt) -gt 10 ]; then
            git diff --quiet && git diff --staged --quiet || git commit -m "به‌روزرسانی خودکار کانفیگ‌ها [skip ci]"
            git push origin HEAD:$(git rev-parse --abbrev-ref HEAD)
            echo "✅ فایل merged.txt با $(wc -l < merged.txt) کانفیگ به‌روز شد."
          else
            echo "⚠️ خطا: تعداد کانفیگ‌ها بسیار کم است (کمتر از 10). commit انجام نشد."
            exit 1
          fi
