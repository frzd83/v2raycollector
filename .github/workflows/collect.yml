name: جمع‌آوری کانفیگ‌های V2Ray از منابع معتبر

on:
  schedule:
    - cron: '*/120 * * * *'
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: دریافت کد مخزن
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: دانلود کانفیگ‌ها
        run: |
          echo "🔄 شروع دانلود از منابع..."
          
          # منبع 1: Epodonios (معتبر و به‌روز)
          curl -s -o source1.txt https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/v2ray.txt
          
          # منبع 2: freefq (قدیمی و پایدار)
          curl -s -o source2.txt https://raw.githubusercontent.com/freefq/free/master/v2ray
          
          # منبع 3: v2ray-configs (پشتیبان)
          curl -s -o source3.txt https://raw.githubusercontent.com/tdslf/v2ray-configs/main/v2ray.txt

      - name: ترکیب و آماده‌سازی
        run: |
          # ایجاد فایل نهایی
          echo "# V2Ray Configs - Updated: $(date)" > merged.txt
          echo "" >> merged.txt
          
          # اضافه کردن همه فایل‌ها (حتی اگر خالی باشند)
          cat source1.txt >> merged.txt 2>/dev/null || true
          cat source2.txt >> merged.txt 2>/dev/null || true
          cat source3.txt >> merged.txt 2>/dev/null || true
          
          # حذف خطوط خالی و تکراری
          sed -i '/^$/d' merged.txt
          sort -u -o merged.txt merged.txt
          
          # نمایش تعداد کانفیگ‌ها
          COUNT=$(wc -l < merged.txt)
          echo "✅ تعداد کانفیگ‌های جمع‌آوری شده: $COUNT"

      - name: ذخیره در مخزن
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add merged.txt
          
          # همیشه commit کن (حتی اگر فایل خالی باشد)
          git commit -m "به‌روزرسانی خودکار کانفیگ‌ها [skip ci]" || echo "تغییری وجود نداشت"
          git push
