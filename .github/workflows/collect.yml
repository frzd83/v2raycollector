name: جمع‌آوری کانفیگ‌های تست شده از منابع برتر

on:
  schedule:
    - cron: '*/120 * * * *'  # هر ۲ ساعت یک بار
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: دانلود کانفیگ‌های تست شده
        run: |
          # منبع 1: کانفیگ تست شده دلتا (بالاترین کیفیت و تضمین شده)
          curl -L -o source_delta.txt https://raw.githubusercontent.com/Delta-Kronecker/V2ray-Config/main/vless.txt
          
          # منبع 2: کانفیگ امن برای ایران و مودم همراه
          curl -L -o source_rjsxrd.txt https://raw.githubusercontent.com/whoahaow/rjsxrd/main/default/1

      - name: ادغام و پاکسازی
        run: |
          > merged.txt
          echo "# =========================================" >> merged.txt
          echo "# کانفیگ‌های تست شده از منابع معتبر" >> merged.txt
          echo "# به‌روز شده در تاریخ: $(date)" >> merged.txt
          echo "# =========================================" >> merged.txt
          echo "" >> merged.txt
          
          # ادغام دو منبع و حذف کامل خطوط تکراری
          cat source_delta.txt source_rjsxrd.txt | sort -u >> merged.txt

      - name: Commit و Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add merged.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "به‌روزرسانی خودکار کانفیگ‌ها [skip ci]"
          git push origin HEAD:$(git rev-parse --abbrev-ref HEAD)
