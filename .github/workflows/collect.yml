name: جمع‌آوری کانفیگ‌های تست شده

on:
  schedule:
    - cron: '*/120 * * * *'
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: دانلود کانفیگ‌های فعال
        run: |
          # منبع 1: مخزن قوی از کانفیگ‌های VLESS (جایگزین دلتا)
          curl -L -o source1.txt https://raw.githubusercontent.com/soroushmirzaei/V2ray-configs/main/vless.txt
          
          # منبع 2: ترکیبی از پروتکل‌های مختلف (جایگزین rjsxrd)
          curl -L -o source2.txt https://raw.githubusercontent.com/freefq/free/master/v2ray

      - name: ادغام و پاکسازی
        run: |
          > merged.txt
          echo "# =========================================" >> merged.txt
          echo "# کانفیگ‌های تست شده از منابع جایگزین" >> merged.txt
          echo "# به‌روز شده در تاریخ: $(date)" >> merged.txt
          echo "# =========================================" >> merged.txt
          echo "" >> merged.txt
          
          cat source1.txt source2.txt | sort -u | grep -E "(vless://|vmess://|trojan://)" >> merged.txt

      - name: Commit و Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add merged.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "به‌روزرسانی خودکار [skip ci]"
          git push origin HEAD:$(git rev-parse --abbrev-ref HEAD)
