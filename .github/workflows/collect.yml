name: جمع‌آوری کانفیگ‌های V2Ray (نسخه نهایی)

on:
  schedule:
    - cron: '*/120 * * * *'
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: دریافت کد مخزن
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: دانلود کانفیگ‌ها از منابع جایگزین
        run: |
          echo "🔄 شروع دانلود از منابع جدید..."
          
          # منبع 1: v2ray-configs (منبع اصلی و فعال)
          curl -L -o source1.txt https://raw.githubusercontent.com/v2fly/v2ray-configs/main/README.md || echo "منبع 1 در دسترس نیست"
          
          # منبع 2: کانفیگ‌های ساده و سبک
          curl -L -o source2.txt https://raw.githubusercontent.com/Poiuytrewq111/Free-Configs/main/configs.txt || echo "منبع 2 در دسترس نیست"
          
          # منبع 3: پشتیبان نهایی
          curl -L -o source3.txt https://raw.githubusercontent.com/mojtabaesl/V2Ray-Configs/main/README.md || echo "منبع 3 در دسترس نیست"

      - name: ترکیب و ذخیره
        run: |
          # ایجاد فایل نهایی با هدر
          echo "# V2Ray Configs - به‌روز شده در تاریخ: $(date)" > merged.txt
          echo "" >> merged.txt
          
          # ترکیب فایل‌های دانلود شده (حذف خطوط تکراری)
          cat source1.txt source2.txt source3.txt 2>/dev/null | sort -u >> merged.txt
          
          # حذف خطوط خالی
          sed -i '/^$/d' merged.txt
          
          # آمار نهایی
          echo "✅ تعداد کل خطوط: $(wc -l < merged.txt)"

      - name: ذخیره در مخزن
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add merged.txt
          git commit -m "به‌روزرسانی خودکار [skip ci]" || echo "تغییری وجود نداشت"
          git push
